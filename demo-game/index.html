<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>iIME - タイピングゲーム</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@400;500;600;700&family=Shippori+Mincho:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="container">
    <header class="header">
      <h1 class="title">iIME タイピング体験</h1>
      <p class="subtitle">自作IMEの操作性と変換精度をテストしよう</p>
    </header>

    <main class="demo-section">
      <div id="screen-menu" class="screen active">
        <div class="menu-grid">
          <button class="btn btn-mode" onclick="startGame('free')">
            <span class="mode-title">自由試し打ち</span>
            <span class="mode-desc">時間制限なしで自由に打感をテスト</span>
          </button>
          <button class="btn btn-mode" onclick="startGame('easy')">
            <span class="mode-title">EASY モード</span>
            <span class="mode-desc">短い単語や簡単な文章（全3問）</span>
          </button>
          <button class="btn btn-mode" onclick="startGame('normal')">
            <span class="mode-title">NORMAL モード</span>
            <span class="mode-desc">漢字変換を含む長めの文章（全3問）</span>
          </button>
        </div>
      </div>

      <div id="screen-game" class="screen">
        <div class="input-card">
          <div class="card-header">
            <span id="game-mode-badge" class="card-badge badge-active">EASY</span>
            <span id="game-progress" class="card-desc">第 1 / 3 問</span>
          </div>

          <div class="target-box">
            <div id="target-text" class="target-text">お題がここに表示されます</div>
          </div>

          <div class="input-wrapper">
            <input 
              type="text" 
              id="typing-input" 
              class="demo-input ime-enabled" 
              placeholder="ここに入力して確定（Enter）"
              autocomplete="off"
            >
          </div>

          <div class="hint-container">
            <span class="hint-item"><kbd>Tab</kbd> 候補切替</span>
            <span class="hint-divider">•</span>
            <span class="hint-item"><kbd>Space</kbd> 変換確定</span>
            <span class="hint-divider">•</span>
            <span class="hint-item"><kbd>Enter</kbd> 回答確定</span>
          </div>
        </div>

        <div style="text-align: center; margin-top: 1.5rem;">
          <button class="btn-sub" onclick="showMenu()">← モード選択に戻る</button>
        </div>
      </div>

      <div id="screen-result" class="screen">
        <div class="input-card result-card">
          <h2>クリアおめでとうございます！</h2>
          <p class="result-time">タイム: <span id="final-time">0.00</span> 秒</p>
          <button class="btn btn-mode" onclick="showMenu()" style="margin-top: 1rem;">メニューに戻る</button>
        </div>
      </div>
    </main>
  </div>

  <script src="js/inputBasicKeys.js"></script>
  <script src="js/inputSpace.js"></script>
  <script src="js/dictionary.js"></script>
  <script src="js/encodeText.js"></script>
  <script src="js/main.js"></script>

  <script src="js/app.js"></script>
</body>
</html>
